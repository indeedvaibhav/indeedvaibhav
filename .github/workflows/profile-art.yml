name: Refresh profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - "assets/profile/3d-contribution-settings.json"
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: assets/profile/3d-contribution-settings.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/fetch_leetcode.py
      - run: python scripts/render_profile_art.py
      - run: python scripts/render_readme_cards.py
      - run: python scripts/render_leetcode_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile contribution art [skip ci]"
          file_pattern: "data/contributions.json data/leetcode.json contrib-heatmap.svg stats.svg leetcode.svg assets/leetcode-badges/* cards/*.svg profile-3d-contrib/*.svg"

