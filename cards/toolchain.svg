<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="374" viewBox="0 0 1080 374" role="img" aria-labelledby="title desc"><title id="title">Engineering Toolchain</title><desc id="desc">A connected map of Vaibhav Tripathi’s languages, product UI, backend services, data systems, and applied intelligence technologies.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17131a"/><stop offset="1" stop-color="#0b0d12"/></linearGradient><linearGradient id="wire"><stop stop-color="#f04452" stop-opacity=".8"/><stop offset="1" stop-color="#58a6ff" stop-opacity=".55"/></linearGradient></defs><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.mod{opacity:0;animation:up .55s ease-out forwards}.trace{stroke-dasharray:7 8;animation:flow 8s linear infinite}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes flow{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.mod{animation:none;opacity:1;transform:none}.trace{animation:none}}</style><rect x=".5" y=".5" width="1079" height="373" rx="14" fill="url(#bg)" stroke="#292e38"/><path d="M18 1h210" stroke="#f04452" stroke-width="2"/><text x="26" y="35" fill="#f04452" font-size="11" letter-spacing="2.5">TOOLCHAIN / SYSTEM MAP</text><text x="1054" y="35" fill="#59616e" font-size="10" text-anchor="end">CODE → PRODUCT → DECISIONS</text><path class="trace" d="M350 133h27m326 0h27M187 194v11q0 14 14 14h78M893 194v11q0 14-14 14h-78M534 280h12" fill="none" stroke="url(#wire)" stroke-width="1.5"/><g class="mod" style="animation-delay:0.08s"><rect x="24" y="70" width="326" height="124" rx="10" fill="#11141b" stroke="#292e38"/><text x="41" y="95" fill="#f04452" font-size="10" letter-spacing="1.2">01 / LANGUAGES</text><text x="41" y="126" fill="#f1f3f5" font-size="14" font-weight="650">Java · Python</text><text x="41" y="149" fill="#f1f3f5" font-size="14" font-weight="650">JavaScript · TypeScript</text><text x="41" y="175" fill="#9299a5" font-size="10">DSA / problem solving</text><circle cx="333" cy="93" r="3" fill="#f04452"/></g><g class="mod" style="animation-delay:0.16s"><rect x="377" y="70" width="326" height="124" rx="10" fill="#11141b" stroke="#292e38"/><text x="394" y="95" fill="#f04452" font-size="10" letter-spacing="1.2">02 / PRODUCT UI</text><text x="394" y="126" fill="#f1f3f5" font-size="14" font-weight="650">React · Next.js</text><text x="394" y="149" fill="#f1f3f5" font-size="14" font-weight="650">Vite · Tailwind CSS</text><text x="394" y="175" fill="#9299a5" font-size="10">Interfaces / web apps</text><circle cx="686" cy="93" r="3" fill="#f04452"/></g><g class="mod" style="animation-delay:0.24s"><rect x="730" y="70" width="326" height="124" rx="10" fill="#11141b" stroke="#292e38"/><text x="747" y="95" fill="#f04452" font-size="10" letter-spacing="1.2">03 / SERVICES</text><text x="747" y="126" fill="#f1f3f5" font-size="14" font-weight="650">Spring Boot · Node.js</text><text x="747" y="149" fill="#f1f3f5" font-size="14" font-weight="650">Express · FastAPI</text><text x="747" y="175" fill="#9299a5" font-size="10">REST APIs / backend</text><circle cx="1039" cy="93" r="3" fill="#f04452"/></g><g class="mod" style="animation-delay:0.32s"><rect x="24" y="218" width="510" height="124" rx="10" fill="#11141b" stroke="#292e38"/><text x="41" y="243" fill="#f04452" font-size="10" letter-spacing="1.2">04 / DATA + PERSISTENCE</text><text x="41" y="274" fill="#f1f3f5" font-size="14" font-weight="650">PostgreSQL · MySQL · SQL</text><text x="41" y="297" fill="#f1f3f5" font-size="14" font-weight="650">JPA / Hibernate</text><text x="41" y="323" fill="#9299a5" font-size="10">Relational modeling</text><circle cx="517" cy="241" r="3" fill="#f04452"/></g><g class="mod" style="animation-delay:0.40s"><rect x="546" y="218" width="510" height="124" rx="10" fill="#11141b" stroke="#292e38"/><text x="563" y="243" fill="#f04452" font-size="10" letter-spacing="1.2">05 / APPLIED INTELLIGENCE</text><text x="563" y="274" fill="#f1f3f5" font-size="14" font-weight="650">Machine learning · LLM APIs</text><text x="563" y="297" fill="#f1f3f5" font-size="14" font-weight="650">RAG concepts · maps · Leaflet</text><text x="563" y="323" fill="#9299a5" font-size="10">Geospatial / data-led tools</text><circle cx="1039" cy="241" r="3" fill="#f04452"/></g><text x="26" y="362" fill="#59616e" font-size="9" letter-spacing="1.4">FOUNDATIONS IN JAVA + DSA · BUILT THROUGH BACKEND, WEB, DATA, AND APPLIED AI</text><text x="1054" y="362" fill="#59616e" font-size="9" text-anchor="end">CURRENT STACK / CURATED</text></svg>
