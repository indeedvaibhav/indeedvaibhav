<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="282" viewBox="0 0 1080 282" role="img" aria-labelledby="title desc"><title id="title">Build, Systems, and Intelligence</title><desc id="desc">Three readable profile focus panels for Java and backend engineering, data systems, and applied AI.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17131a"/><stop offset="1" stop-color="#0b0d12"/></linearGradient><linearGradient id="line"><stop stop-color="#f04452"/><stop offset="1" stop-color="#f04452" stop-opacity="0"/></linearGradient></defs><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.panel{opacity:0;animation:up .65s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.panel{animation:none;opacity:1;transform:none}}</style><rect x=".5" y=".5" width="1079" height="281" rx="14" fill="url(#bg)" stroke="#292e38"/><path d="M18 1h210" stroke="url(#line)" stroke-width="2"/><text x="26" y="35" fill="#f04452" font-size="11" letter-spacing="2.5">PROFILE / ENGINEERING FOCUS</text><text x="1054" y="35" fill="#59616e" font-size="10" text-anchor="end">BUILD → SYSTEMS → INTELLIGENCE</text><g class="panel" style="animation-delay:0.08s"><rect x="20" y="55" width="332" height="207" rx="11" fill="#11141b" stroke="#292e38"/><text x="38" y="84" fill="#f04452" font-size="10" letter-spacing="1.4">01 / FOCUS</text><text x="38" y="112" fill="#f1f3f5" font-size="20" font-weight="700">BUILD</text><line x1="38" y1="126" x2="334" y2="126" stroke="#292e38"/><circle cx="42" cy="149" r="2.5" fill="#f04452"/><text x="53" y="153" fill="#9299a5" font-size="13">Java + DSA</text><circle cx="42" cy="174" r="2.5" fill="#f04452"/><text x="53" y="178" fill="#9299a5" font-size="13">Spring Boot + REST APIs</text><circle cx="42" cy="199" r="2.5" fill="#f04452"/><text x="53" y="203" fill="#9299a5" font-size="13">Backend engineering</text><circle cx="42" cy="224" r="2.5" fill="#f04452"/><text x="53" y="228" fill="#9299a5" font-size="13">React + Next.js</text></g><g class="panel" style="animation-delay:0.21s"><rect x="372" y="55" width="332" height="207" rx="11" fill="#11141b" stroke="#292e38"/><text x="390" y="84" fill="#f04452" font-size="10" letter-spacing="1.4">02 / FOCUS</text><text x="390" y="112" fill="#f1f3f5" font-size="20" font-weight="700">SYSTEMS</text><line x1="390" y1="126" x2="686" y2="126" stroke="#292e38"/><circle cx="394" cy="149" r="2.5" fill="#f04452"/><text x="405" y="153" fill="#9299a5" font-size="13">Service + API design</text><circle cx="394" cy="174" r="2.5" fill="#f04452"/><text x="405" y="178" fill="#9299a5" font-size="13">PostgreSQL + JPA</text><circle cx="394" cy="199" r="2.5" fill="#f04452"/><text x="405" y="203" fill="#9299a5" font-size="13">Relational data modeling</text><circle cx="394" cy="224" r="2.5" fill="#f04452"/><text x="405" y="228" fill="#9299a5" font-size="13">Maps + dashboards</text></g><g class="panel" style="animation-delay:0.34s"><rect x="724" y="55" width="332" height="207" rx="11" fill="#11141b" stroke="#292e38"/><text x="742" y="84" fill="#f04452" font-size="10" letter-spacing="1.4">03 / FOCUS</text><text x="742" y="112" fill="#f1f3f5" font-size="20" font-weight="700">INTELLIGENCE</text><line x1="742" y1="126" x2="1038" y2="126" stroke="#292e38"/><circle cx="746" cy="149" r="2.5" fill="#f04452"/><text x="757" y="153" fill="#9299a5" font-size="13">Machine learning</text><circle cx="746" cy="174" r="2.5" fill="#f04452"/><text x="757" y="178" fill="#9299a5" font-size="13">LLM-powered applications</text><circle cx="746" cy="199" r="2.5" fill="#f04452"/><text x="757" y="203" fill="#9299a5" font-size="13">RAG concepts</text><circle cx="746" cy="224" r="2.5" fill="#f04452"/><text x="757" y="228" fill="#9299a5" font-size="13">Civic decision support</text></g></svg>
