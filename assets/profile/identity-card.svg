<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Tripathi identity card</title>
  <desc id="desc">A terminal-style identity card with a VT monogram and profile coordinates.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10131A"/><stop offset="1" stop-color="#090B10"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F04452"/><stop offset="1" stop-color="#FFB454"/></linearGradient>
    <pattern id="p" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#252A34" stroke-width=".7"/></pattern>
  </defs>
  <rect width="520" height="340" rx="16" fill="url(#g)"/>
  <rect width="520" height="340" rx="16" fill="url(#p)" opacity=".65"/>
  <rect x=".5" y=".5" width="519" height="339" rx="16" fill="none" stroke="#3A2028"/>
  <path d="M0 52H520" stroke="#30363D"/>
  <circle cx="22" cy="26" r="4" fill="#F04452"/><circle cx="37" cy="26" r="4" fill="#FFB454"/><circle cx="52" cy="26" r="4" fill="#3FB950"/>
  <text x="260" y="30" fill="#8B949E" font-family="Consolas,monospace" font-size="11" text-anchor="middle">IDENTITY / NODE 001</text>
  <circle cx="112" cy="143" r="65" fill="#0B0E14" stroke="url(#a)" stroke-width="2"/>
  <circle cx="112" cy="143" r="54" fill="none" stroke="#30363D" stroke-dasharray="2 5"/>
  <path d="M112 74V91M112 195V212M43 143H60M164 143H181" stroke="#F04452" stroke-width="2"/>
  <text x="112" y="158" fill="#E6EDF3" font-family="Arial,sans-serif" font-weight="800" font-size="38" text-anchor="middle">VT</text>
  <text x="112" y="232" fill="#8B949E" font-family="Consolas,monospace" font-size="9" text-anchor="middle">FIELD IDENTIFIER / VT</text>
  <text x="220" y="82" fill="#8B949E" font-family="Consolas,monospace" font-size="10">ROLE</text>
  <text x="220" y="102" fill="#E6EDF3" font-family="Consolas,monospace" font-size="13">CSE UNDERGRAD</text>
  <text x="220" y="132" fill="#8B949E" font-family="Consolas,monospace" font-size="10">CORE</text>
  <text x="220" y="152" fill="#FFB454" font-family="Consolas,monospace" font-size="13">JAVA / DSA</text>
  <text x="220" y="182" fill="#8B949E" font-family="Consolas,monospace" font-size="10">SYSTEMS</text>
  <text x="220" y="202" fill="#58A6FF" font-family="Consolas,monospace" font-size="13">SPRING / POSTGRES</text>
  <text x="220" y="232" fill="#8B949E" font-family="Consolas,monospace" font-size="10">SURFACE</text>
  <text x="220" y="252" fill="#3FB950" font-family="Consolas,monospace" font-size="13">REACT / NEXT / AI</text>
  <path d="M28 276H492" stroke="#30363D"/>
  <text x="28" y="301" fill="#8B949E" font-family="Consolas,monospace" font-size="10">EDUCATION</text>
  <text x="28" y="321" fill="#E6EDF3" font-family="Consolas,monospace" font-size="12">PSIT KANPUR · B.TECH CSE · YEAR 03</text>
  <circle cx="474" cy="310" r="5" fill="#3FB950"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>
