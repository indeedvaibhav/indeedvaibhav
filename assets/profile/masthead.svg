<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Tripathi — engineering profile</title>
  <desc id="desc">A redline-inspired control panel for a computer science student building Java, backend, full-stack, and applied AI systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B10"/><stop offset="1" stop-color="#11131A"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F04452"/><stop offset="1" stop-color="#FF8B5E"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#222733" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#F6F7F9" stroke-opacity=".035"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="330" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)" opacity=".85"/>
    <path d="M0 286H540L608 218H742" fill="none" stroke="#F04452" stroke-width="2" opacity=".52"/>
    <path d="M0 300H520L610 210H758" fill="none" stroke="#FFB454" stroke-width="1" opacity=".28"/>
    <path d="M870 0V64L920 114H1200" fill="none" stroke="#58A6FF" stroke-width="1" opacity=".42"/>
    <path d="M0 36H170L204 70H374" fill="none" stroke="#F04452" stroke-width="1" opacity=".32"/>
    <rect width="1200" height="330" fill="url(#scan)"/>
    <rect x="-120" y="55" width="14" height="255" fill="#F04452" opacity=".16">
