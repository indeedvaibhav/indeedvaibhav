<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Tripathi — build signal</title>
  <desc id="desc">A dark crimson developer command deck with animated radar, build traces, and Vaibhav Tripathi’s Java, backend, full-stack, and applied AI focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07080D"/><stop offset=".58" stop-color="#11131A"/><stop offset="1" stop-color="#190B12"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F04452"/><stop offset=".55" stop-color="#FF5268"/><stop offset="1" stop-color="#FF9A63"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F04452" stop-opacity=".40"/><stop offset="1" stop-color="#F04452" stop-opacity="0"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#F04452" stop-opacity=".28"/><stop offset="1" stop-color="#F04452" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#303642" stroke-opacity=".55" stroke-width="1"/><circle cx="0" cy="0" r="1" fill="#78808F" fill-opacity=".35"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#FFF" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity=".8"/>
    <ellipse cx="1040" cy="185" rx="260" ry="190" fill="url(#core)"/>

    <!-- Moving scan bars and circuit traces -->
    <path d="M0 286H475L535 226H690M0 302H455L535 222H714" fill="none" stroke="url(#hot)" stroke-width="1.3" opacity=".58"/>
    <path d="M0 44H206L232 70H366M875 0V42L917 84H1200M1174 282H1120L1087 315H1028" fill="none" stroke="#F04452" stroke-width="1" opacity=".38"/>
    <path d="M690 226h24v-20h38" fill="none" stroke="#FFB454" stroke-width="1" opacity=".55"/>
    <circle cx="535" cy="226" r="3" fill="#FF5268" filter="url(#glow)"/>
    <circle cx="917" cy="84" r="3" fill="#FFB454"/>
    <rect x="-160" y="64" width="34" height="260" fill="#F04452" opacity=".12"><animate attributeName="x" from="-160" to="1240" dur="7s" repeatCount="indefinite"/></rect>
    <path d="M50 0V360M745 0V360" stroke="#F04452" stroke-opacity=".11" stroke-dasharray="2 8"/>

    <!-- Identity panel -->
    <path d="M52 74V42H84M52 326V294M52 326H84M706 74V42H674" fill="none" stroke="#FF5268" stroke-width="2" opacity=".8"/>
    <text x="72" y="46" fill="#AAB1BD" font-family="Consolas,monospace" font-size="11" letter-spacing="2">INDEEDVAIBHAV <tspan fill="#F04452">//</tspan> BUILD SIGNAL</text>
    <circle cx="445" cy="42" r="4.5" fill="#F04452" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="72" y="137" fill="#F2F4F8" font-family="Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-2">VAIBHAV</text>
    <text x="70" y="204" fill="#FF5268" fill-opacity=".42" font-family="Arial,sans-serif" font-size="66" font-weight="900" letter-spacing="1"><animate attributeName="x" values="70;73;69;70" dur="4.2s" repeatCount="indefinite"/>TRIPATHI</text>
    <text x="72" y="201" fill="url(#hot)" font-family="Arial,sans-serif" font-size="66" font-weight="900" letter-spacing="1">TRIPATHI</text>
    <path d="M72 218H652" stroke="#353945"/>
    <text x="74" y="248" fill="#F2F4F8" font-family="Consolas,monospace" font-size="14" letter-spacing="1.2">JAVA <tspan fill="#F04452">/</tspan> BACKEND <tspan fill="#F04452">/</tspan> FULL-STACK <tspan fill="#F04452">/</tspan> APPLIED AI</text>
    <text x="74" y="273" fill="#9AA2AE" font-family="Consolas,monospace" font-size="11" letter-spacing=".8">CSE UNDERGRAD · PSIT KANPUR · BUILD → SHIP → REFINE</text>

    <!-- A little command-line energy -->
    <g font-family="Consolas,monospace" font-size="10" letter-spacing=".6">
      <rect x="72" y="294" width="142" height="27" rx="4" fill="#1A1118" stroke="#6B2733"/><circle cx="87" cy="307.5" r="3" fill="#F04452"/><text x="98" y="311" fill="#F2A0A8">BUILD</text>
      <rect x="222" y="294" width="142" height="27" rx="4" fill="#15131A" stroke="#45303B"/><circle cx="237" cy="307.5" r="3" fill="#FFB454"/><text x="248" y="311" fill="#E4C69C">SHIP</text>
      <rect x="372" y="294" width="182" height="27" rx="4" fill="#14171A" stroke="#34433E"/><circle cx="387" cy="307.5" r="3" fill="#63C98A"/><text x="398" y="311" fill="#B0D9BE">REFINE</text>
      <text x="72" y="342" fill="#FFB454" font-size="9" letter-spacing="1.3">OPEN TO INTERNSHIPS · HACKATHONS · OPEN SOURCE</text>
    </g>

    <!-- Animated radar / capability constellation -->
    <rect x="760" y="28" width="394" height="304" rx="15" fill="#090B11" fill-opacity=".92" stroke="#3B303A"/>
    <path d="M760 72H1154" stroke="#34343F"/>
    <circle cx="783" cy="50" r="4" fill="#F04452"><animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="798" cy="50" r="4" fill="#FFB454"/><circle cx="813" cy="50" r="4" fill="#63C98A"/>
    <text x="845" y="54" fill="#C5CBD4" font-family="Consolas,monospace" font-size="10" letter-spacing="1.3">FIELD SYSTEMS <tspan fill="#F04452">/</tspan> DEV MODE</text>
    <text x="1128" y="54" fill="#F04452" font-family="Consolas,monospace" font-size="9" text-anchor="end" letter-spacing="1">ONLINE</text>

    <g transform="translate(957 201)">
      <circle r="108" fill="#0D0D14" stroke="#3B303A"/>
      <circle r="88" fill="none" stroke="#42303A" stroke-dasharray="2 7"/>
      <circle r="66" fill="none" stroke="#34343F"/>
      <circle r="43" fill="none" stroke="#4A3039" stroke-dasharray="3 5"/>
      <path d="M0 0L0-88A88 88 0 0 1 58-66Z" fill="url(#beam)"/>
      <g stroke="#F04452" stroke-opacity=".78" fill="none"><path d="M0 0L0-88A88 88 0 0 1 58-66"/><path d="M-108 0H108M0-108V108" stroke-opacity=".2"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><path d="M0 0V-88" stroke="#FF5268" stroke-width="2" filter="url(#glow)"/><circle cx="0" cy="-88" r="3" fill="#FFB454"/></g>
      <circle cx="0" cy="0" r="34" fill="#171019" stroke="#F04452" stroke-opacity=".8"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#F04452" stroke-opacity=".25"><animate attributeName="r" values="22;29;22" dur="3s" repeatCount="indefinite"/></circle>
      <text x="0" y="-2" fill="#F2F4F8" font-family="Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">BUILD</text>
      <text x="0" y="13" fill="#F04452" font-family="Consolas,monospace" font-size="8" text-anchor="middle" letter-spacing="1">/ MODE</text>
      <circle cx="-55" cy="-46" r="5" fill="#F04452" filter="url(#glow)"/><circle cx="60" cy="-48" r="5" fill="#FFB454"/><circle cx="72" cy="31" r="5" fill="#58A6FF"/><circle cx="-63" cy="48" r="5" fill="#63C98A"/>
      <text x="-72" y="-58" fill="#F2A0A8" font-family="Consolas,monospace" font-size="8">DSA</text><text x="69" y="-61" fill="#E4C69C" font-family="Consolas,monospace" font-size="8">API</text><text x="81" y="35" fill="#9BC9FF" font-family="Consolas,monospace" font-size="8">UI</text><text x="-83" y="61" fill="#B0D9BE" font-family="Consolas,monospace" font-size="8">AI</text>
    </g>
    <path d="M1080 112h43v27h-43zM1092 125h19" fill="none" stroke="#FF5268" stroke-opacity=".75"/>
    <path d="M1080 285h42" stroke="#34343F"/><text x="1080" y="302" fill="#89919E" font-family="Consolas,monospace" font-size="8" letter-spacing="1">COORDINATES</text><text x="1127" y="318" fill="#FFB454" font-family="Consolas,monospace" font-size="10" text-anchor="end">KANPUR / IN</text>
    <path d="M1166 80V114M1166 245V279" stroke="#F04452" stroke-width="2" opacity=".8"/>
    <rect width="1200" height="360" fill="url(#scan)" pointer-events="none"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="20" fill="none" stroke="#522630"/>
</svg>
