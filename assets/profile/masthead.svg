    <text x="800" y="128" fill="#E6EDF3" font-family="Consolas,monospace" font-size="21" font-weight="700">JAVA</text>
    <text x="1000" y="100" fill="#8B949E" font-family="Consolas,monospace" font-size="11">BUILD MODE</text>
