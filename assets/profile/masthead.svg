    <path d="M800 148H1132" stroke="#30363D"/>
    <text x="800" y="174" fill="#8B949E" font-family="Consolas,monospace" font-size="10">STACK TRACE</text>
    <path d="M810 202H1116" stroke="#30363D" stroke-width="3"/>
    <path d="M810 202H1054" stroke="url(#red)" stroke-width="3"/>
    <circle cx="810" cy="202" r="6" fill="#F04452"/><circle cx="914" cy="202" r="6" fill="#FFB454"/><circle cx="1017" cy="202" r="6" fill="#58A6FF"/><circle cx="1116" cy="202" r="6" fill="#3FB950"/>
    <text x="810" y="226" fill="#E6EDF3" font-family="Consolas,monospace" font-size="9">DSA</text>
    <text x="914" y="226" fill="#E6EDF3" font-family="Consolas,monospace" font-size="9" text-anchor="middle">API</text>
    <text x="1017" y="226" fill="#E6EDF3" font-family="Consolas,monospace" font-size="9" text-anchor="middle">UI</text>
    <text x="1116" y="226" fill="#E6EDF3" font-family="Consolas,monospace" font-size="9" text-anchor="end">AI</text>
    <path d="M800 246H1132" stroke="#30363D"/>
    <text x="800" y="272" fill="#8B949E" font-family="Consolas,monospace" font-size="10">COORDINATES</text>
    <text x="1132" y="272" fill="#FFB454" font-family="Consolas,monospace" font-size="12" text-anchor="end">KANPUR / IN</text>
