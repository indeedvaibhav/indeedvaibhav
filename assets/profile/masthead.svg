<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Tripathi — student developer learning AI and machine learning</title>
  <desc id="desc">A bold, expressive typographic banner for Vaibhav Tripathi, a third-year CSE student at PSIT Kanpur focused on Java, backend and full-stack development, and currently learning AI and machine learning.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101014"/>
      <stop offset=".58" stop-color="#191014"/>
      <stop offset="1" stop-color="#26110F"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4F4B"/>
      <stop offset=".52" stop-color="#FF714F"/>
      <stop offset="1" stop-color="#FFC36A"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#EF3F4A" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#FF674A" stop-opacity=".74"/>
      <stop offset="1" stop-color="#FFB64D" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".8" fill="#F5D8C0" opacity=".16"/>
      <circle cx="22" cy="19" r=".7" fill="#F5D8C0" opacity=".1"/>
      <path d="M30 2l2 1M9 29l2-.6" stroke="#F5D8C0" stroke-width=".65" opacity=".13"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#ground)"/>
    <ellipse cx="1052" cy="203" rx="250" ry="184" fill="#EB4C3F" opacity=".15" filter="url(#blur)"/>
    <rect width="1200" height="360" fill="url(#grain)" opacity=".72"/>

    <!-- Loose, hand-drawn paint movement: a single expressive gesture, not a UI panel -->
    <g opacity=".94">
      <path d="M792 80c74 25 111 55 159 93 53 42 92 68 190 87" fill="none" stroke="url(#wash)" stroke-width="24" stroke-linecap="round"/>
      <path d="M805 67c61 18 99 44 143 77 62 48 105 73 194 93" fill="none" stroke="#FFB25E" stroke-width="2" stroke-linecap="round" opacity=".6"/>
      <path d="M834 309c57-48 87-93 137-140 40-38 86-68 153-85" fill="none" stroke="#F04A48" stroke-width="5" stroke-linecap="round" opacity=".58"/>
      <path d="M773 318c29-21 43-38 61-63" fill="none" stroke="#FFC06B" stroke-width="2" stroke-linecap="round" opacity=".66"/>
    </g>

    <!-- Personal introduction -->
    <text x="68" y="50" fill="#F0B9A0" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">THIRD YEAR  ·  CSE  ·  PSIT KANPUR</text>
    <path d="M68 68h153" stroke="#F15B4B" stroke-width="3" stroke-linecap="round"/>
    <path d="M227 68h35" stroke="#F15B4B" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>

    <text x="60" y="165" fill="#FFF3E7" font-family="Arial,sans-serif" font-size="104" font-weight="900" letter-spacing="-5">VAIBHAV</text>
    <text x="66" y="248" fill="url(#flare)" font-family="Arial,sans-serif" font-size="88" font-weight="900" letter-spacing="-2">TRIPATHI</text>

    <!-- Marker-like underline with a little motion -->
    <path d="M72 265c105 5 219 4 352-2 93-4 151-2 201 3" fill="none" stroke="#FF634C" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" dur="5.5s" repeatCount="indefinite" values="M72 265c105 5 219 4 352-2 93-4 151-2 201 3;M72 265c105 2 219 7 352 1 93-4 151-1 201 2;M72 265c105 5 219 4 352-2 93-4 151-2 201 3"/>
    </path>
    <text x="72" y="303" fill="#F4E7DA" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing=".7">JAVA  ·  BACKEND  ·  FULL STACK</text>
    <text x="72" y="329" fill="#C79B8B" font-family="Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">CURRENTLY LEARNING AI + MACHINE LEARNING</text>

    <!-- Oversized learning focus, kept open on the canvas -->
    <g transform="rotate(-5 1000 189)">
      <path d="M831 131c42-13 82-12 134-4 62 9 117 11 183-1" fill="none" stroke="#FF9C53" stroke-width="7" stroke-linecap="round" opacity=".76"/>
      <text x="850" y="211" fill="#FFF0E3" font-family="Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-8">AI</text>
      <text x="969" y="205" fill="#FF7850" font-family="Arial,sans-serif" font-size="76" font-weight="800">/</text>
      <text x="1003" y="211" fill="#FFF0E3" font-family="Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-8">ML</text>
      <path d="M863 233c82 9 154 11 249 0" fill="none" stroke="#F5B76B" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- Small print-like accent marks -->
    <path d="M1116 58l8 17 18 2-14 11 4 18-16-10-15 10 4-18-14-11 18-2z" fill="url(#flare)" opacity=".92"/>
    <path d="M777 116l14 4M783 109l4 14M1144 282l21-3M1154 271l4 19" stroke="#FFC06B" stroke-width="2" stroke-linecap="round" opacity=".72"/>
    <circle cx="819" cy="284" r="4" fill="#FF7050"/>
    <circle cx="1164" cy="139" r="3" fill="#FFC06B"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="17.5" fill="none" stroke="#65312B" stroke-opacity=".68"/>
</svg>