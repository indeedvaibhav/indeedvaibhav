    <text x="58" y="303" fill="#FFB454" font-family="Consolas,monospace" font-size="11" letter-spacing="1">OPEN TO INTERNSHIPS · HACKATHONS · OPEN SOURCE</text>
    <rect x="776" y="28" width="380" height="274" rx="12" fill="#0B0E14" stroke="#30363D"/>
    <path d="M776 70H1156" stroke="#30363D"/>
    <circle cx="797" cy="49" r="4" fill="#F04452"/><circle cx="812" cy="49" r="4" fill="#FFB454"/><circle cx="827" cy="49" r="4" fill="#3FB950"/>
    <text x="965" y="53" fill="#8B949E" font-family="Consolas,monospace" font-size="11" text-anchor="middle">STATUS / SYSTEMS</text>
