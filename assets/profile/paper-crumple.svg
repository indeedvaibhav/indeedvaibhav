<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc">
  <title id="title">Paper Crumple profile animation</title>
  <desc id="desc">Vaibhav's identity card folds into a textured paper ball and unfolds again.</desc>
  <defs>
    <filter id="wrinkle" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .055" numOctaves="3" seed="8" result="noise">
        <animate attributeName="baseFrequency" values=".018 .024;.035 .055;.07 .09;.035 .055;.018 .024" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="0;3;12;24;18;8;0" keyTimes="0;.18;.34;.5;.66;.82;1" dur="5s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <radialGradient id="paper" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#f1e9da"/>
      <stop offset=".42" stop-color="#b9b0a4"/>
      <stop offset=".78" stop-color="#716d68"/>
      <stop offset="1" stop-color="#292b30"/>
    </radialGradient>
    <filter id="grain" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="4" seed="12"/>
      <feColorMatrix values=".35 0 0 0 .35  0 .32 0 0 .31  0 0 .3 0 .28  0 0 0 .16 0"/>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <ellipse cx="260" cy="198" rx="105" ry="24" fill="#000" opacity=".42" filter="url(#shadow)">
    <animate attributeName="opacity" values=".05;.08;.42;.38;.08;.05" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(260 170)">
    <g filter="url(#wrinkle)">
      <image href="identity-card.svg" x="-260" y="-170" width="520" height="340" preserveAspectRatio="xMidYMid meet"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;.94 .94;.68 .68;.42 .42;.42 .42;.68 .68;.94 .94;1 1" keyTimes="0;.14;.3;.46;.56;.72;.88;1" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g opacity="0" filter="url(#grain)">
    <ellipse cx="260" cy="165" rx="76" ry="62" fill="url(#paper)" stroke="#f4eee4" stroke-opacity=".34" stroke-width="2">
      <animate attributeName="opacity" values="0;0;.92;1;.92;0;0" keyTimes="0;.24;.4;.52;.64;.82;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <g fill="none" stroke-linecap="round">
      <g stroke="#f5eee2" stroke-opacity=".56" stroke-width="2.5">
        <path d="M207 147l30 15 8-34 22 23 28-27 9 33 26 6-27 13 17 26-34-10-13 30-15-29-28 18 7-31-32-3 25-18z"/>
        <path d="M231 118l14 27 21-20 3 25 28-10-16 24 22 17-30-3-9 26-10-28-26 10 14-23-22-15 29 2z"/>
      </g>
      <g stroke="#20242a" stroke-opacity=".72" stroke-width="4">
        <path d="M207 147l30 15 8-34 22 23 28-27 9 33 26 6-27 13 17 26-34-10-13 30-15-29-28 18 7-31-32-3 25-18z"/>
        <path d="M231 118l14 27 21-20 3 25 28-10-16 24 22 17-30-3-9 26-10-28-26 10 14-23-22-15 29 2z"/>
      </g>
    </g>
    <animate attributeName="opacity" values="0;0;1;1;.88;0;0" keyTimes="0;.26;.42;.56;.67;.83;1" dur="5s" repeatCount="indefinite"/>
  </g>
</svg>
